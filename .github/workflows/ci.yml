# Spec §12: 분석, 단위·위젯 테스트(OTS·fontTools 검증 포함), dev import 검사.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 검증 도구 (.venv-tools)
        working-directory: .
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet fonttools opentype-sanitizer pillow

      - run: flutter pub get
      - run: flutter analyze
      - name: dev import 검사
        working-directory: .
        run: tools/check_dev_imports.sh
      - name: 테스트
        env:
          HWAEAEK_REQUIRE_TOOLS: '1'
        run: flutter test
