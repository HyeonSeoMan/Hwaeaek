# Spec §12: 분석, 단위·위젯 테스트(OTS·fontTools 검증 포함), dev import 검사.
# macOS 통합 테스트는 앱 창이 앞에 있어야 화면 갱신이 와서 CI에서 돌리지 않는다(로컬 실행).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 검증 도구 (.venv-tools)
        working-directory: .
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet fonttools opentype-sanitizer pillow

      - run: flutter pub get
      - run: flutter analyze
      - name: dev import 검사
        working-directory: .
        run: tools/check_dev_imports.sh
      - name: 테스트
        env:
          HWAEAEK_REQUIRE_TOOLS: '1'
        run: flutter test
